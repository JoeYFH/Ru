<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>給儒儒的信</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  :root{
    --paper:#FBF6EC;
    --paper-back:#F0E6D2;
    --ink:#4A4238;
    --ink-soft:#7A7062;
    --coral:#E2725B;
    --sage:#8FA783;
    --blue:#7C93B0;
    --blush:#E7ABA6;
    --gold:#D9A441;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(217,164,65,0.06), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(124,147,176,0.06), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
    z-index:9999;
  }
  .caveat{font-family:'Caveat',cursive;}
  .brush{font-family:'Caveat','Noto Sans TC',sans-serif;}

  /* ---------- LOCK / MAIL SCREEN ---------- */
  #lock{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    transition:opacity .6s ease;
  }
  #lock.hide{opacity:0;pointer-events:none;}
  .lock-sub{font-family:'Noto Sans TC',sans-serif;font-size:1.15rem;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:18px;min-height:1.2em;}

  .countdown{display:flex;gap:14px;margin-bottom:22px;}
  .countdown div{display:flex;flex-direction:column;align-items:center;}
  .countdown .num{font-family:'Caveat',cursive;font-weight:700;font-size:2.4rem;color:var(--ink);line-height:1;}
  .countdown .lbl{font-size:.68rem;color:var(--ink-soft);margin-top:2px;}

  .lock-note{font-family:'Noto Sans TC',sans-serif;font-size:.8rem;color:var(--ink-soft);opacity:.75;max-width:260px;line-height:1.6;margin-bottom:6px;}

  #arrival{display:none;flex-direction:column;align-items:center;margin-bottom:10px;}
  .arrived-text{font-family:'Caveat','Noto Sans TC',sans-serif;font-size:2rem;color:var(--coral);margin-top:8px;}

  .unlock-btn{
    font-family:'Caveat','Noto Sans TC',sans-serif;font-size:1.5rem;
    background:var(--coral);color:var(--paper);border:none;border-radius:60px;
    padding:13px 40px;box-shadow:0 6px 0 rgba(74,66,56,0.25);cursor:pointer;
    transition:transform .15s ease;display:none;
  }
  .unlock-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,66,56,0.25);}

  /* ---------- 開信前問答關卡 ---------- */
  #quiz{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .5s ease;
  }
  #quiz.show{opacity:1;visibility:visible;}
  .quiz-progress{font-family:'Caveat',cursive;color:var(--ink-soft);font-size:1.05rem;margin-bottom:10px;letter-spacing:.05em;}
  .quiz-q{font-family:'Noto Sans TC',sans-serif;font-size:1.25rem;line-height:1.8;margin-bottom:22px;max-width:320px;}
  .quiz-input{
    font-family:'Noto Sans TC',sans-serif;font-size:1.05rem;
    padding:10px 16px;border:1px solid rgba(74,66,56,.25);border-radius:30px;
    width:min(80vw,280px);text-align:center;background:var(--paper);color:var(--ink);
    outline:none;margin-bottom:16px;
  }
  .quiz-input:focus{border-color:var(--coral);}
  .quiz-btn{
    font-family:'Caveat','Noto Sans TC',sans-serif;font-size:1.4rem;
    background:var(--coral);color:var(--paper);border:none;border-radius:60px;
    padding:11px 36px;box-shadow:0 6px 0 rgba(74,66,56,0.25);cursor:pointer;
    transition:transform .15s ease;
  }
  .quiz-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,66,56,0.25);}
  .quiz-wrong{font-family:'Caveat','Noto Sans TC',sans-serif;color:var(--coral);font-size:1.05rem;margin-top:14px;min-height:1.4em;opacity:0;transition:opacity .3s ease;}
  .quiz-wrong.show{opacity:1;}
  .quiz-shake{animation:quizShake .4s ease;}
  @keyframes quizShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  .quiz-q-in{animation:quizQIn .45s ease;}
  @keyframes quizQIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ---------- BOOK ---------- */
  #book-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .5s ease;}
  #book-wrap.show{opacity:1;visibility:visible;}
  #stage{position:relative;width:min(92vw,420px);height:min(78vh,620px);perspective:2200px;}
  .page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,.05,.2,1);will-change:transform;}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;background:var(--paper);
    box-shadow:0 10px 30px rgba(74,66,56,.18), 0 2px 0 rgba(74,66,56,.05) inset;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 26px;text-align:center;
    border:1px solid rgba(74,66,56,.08);}
  .face.back{transform:rotateY(180deg);background:var(--paper-back);}
  .doodle{width:96px;height:96px;margin-bottom:18px;}
  .ptitle{font-family:'Caveat','Noto Sans TC',sans-serif;font-weight:400;font-size:1.9rem;margin-bottom:14px;letter-spacing:.03em;}
  .ptext{font-family:'Noto Sans TC',sans-serif;font-size:1.35rem;line-height:2.15;color:var(--ink);letter-spacing:.04em;}
  .pnum{position:absolute;bottom:14px;right:20px;font-family:'Caveat',cursive;font-size:.95rem;color:var(--ink-soft);}
  .corner-mark{position:absolute;top:14px;left:18px;width:20px;height:20px;color:rgba(74,66,56,.35);}

  .cover .ptitle{font-size:2.2rem;color:var(--coral);}
  .cover .ptext{font-size:1rem;color:var(--ink-soft);}
  .final .face{background:linear-gradient(180deg,var(--paper) 60%, #F5E6D8);}
  .final .ptext{font-family:'Caveat','Noto Sans TC',sans-serif;font-size:2.6rem;line-height:1.95;color:var(--ink);}

  /* 照片頁 */
  .face.has-photo{padding:0;}
  .page-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:13px;opacity:0;transition:opacity 1s ease;}
  .page-photo.go{opacity:1;}
  .photo-caption{
    position:absolute;left:0;right:0;bottom:0;
    padding:26px 22px 24px;
    background:linear-gradient(to top, rgba(30,26,20,0.72) 0%, rgba(30,26,20,0.32) 55%, rgba(30,26,20,0) 100%);
    border-radius:0 0 13px 13px;
  }
  .photo-caption .ptitle{color:#FBF6EC;margin-bottom:8px;}
  .photo-caption .ptext{color:#FBF6EC;font-size:.98rem;line-height:1.85;text-shadow:0 1px 4px rgba(0,0,0,.35);}
  .has-photo .pnum{color:#FBF6EC;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .cover.has-photo .ptitle{color:#FBF6EC;}

  .big-line1{font-family:'Caveat','Noto Sans TC',sans-serif;font-size:1.5rem;color:var(--ink-soft);opacity:.75;margin-bottom:22px;letter-spacing:.05em;}
  .big-line2{font-family:'Caveat','Noto Sans TC',sans-serif;font-size:3.2rem;color:var(--coral);line-height:1.4;letter-spacing:.03em;}
  .big-line1 .hw-ch, .big-line2 .hw-ch{animation-name:hwIn;}

  /* handwriting reveal */
  .hw-ch{display:inline-block;opacity:0;transform:translateY(8px) rotate(-4deg);
    animation:hwIn .4s ease forwards;animation-play-state:paused;}
  .go .hw-ch{animation-play-state:running;}
  @keyframes hwIn{to{opacity:1;transform:none;}}

  #dots{position:fixed;bottom:46px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:60;}
  #dots span{width:6px;height:6px;border-radius:50%;background:rgba(74,66,56,.25);transition:background .3s ease, transform .3s ease;}
  #dots span.active{background:var(--coral);transform:scale(1.4);}
  .hint{position:fixed;top:16px;left:0;right:0;text-align:center;font-family:'Caveat',cursive;color:var(--ink-soft);font-size:1rem;opacity:.8;z-index:60;pointer-events:none;transition:opacity .5s ease;}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden;}
  .confetti i{position:absolute;top:-20px;font-size:1.1rem;animation:fall linear forwards;opacity:.85;}
  @keyframes fall{to{transform:translateY(110vh) rotate(300deg);opacity:.2;}}

  .replay{margin-top:16px;font-family:'Caveat','Noto Sans TC',sans-serif;font-size:1.15rem;color:var(--blue);background:none;border:none;text-decoration:underline;cursor:pointer;}
  .photo-caption .replay{color:#FBF6EC;}
  .replay-floating{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    background:rgba(30,26,20,0.45);padding:6px 16px;border-radius:20px;
    text-decoration:none;color:#FBF6EC;
  }

  /* 拆封印章 */
  .stamp{
    position:absolute;top:22px;right:20px;
    padding:8px 14px;border:2px solid rgba(251,246,236,.85);border-radius:8px;
    text-align:center;color:#FBF6EC;text-shadow:0 1px 4px rgba(0,0,0,.4);
    transform:scale(1.7) rotate(-11deg);opacity:0;
    transition:transform .6s cubic-bezier(.34,1.56,.64,1), opacity .45s ease;
    pointer-events:none;
  }
  .stamp.show{opacity:.92;transform:scale(1) rotate(-8deg);}
  .stamp-line1{font-family:'Caveat','Noto Sans TC',sans-serif;font-size:1rem;letter-spacing:.2em;margin-bottom:2px;}
  .stamp-line2{font-family:'Caveat',cursive;font-weight:700;font-size:1.35rem;letter-spacing:.03em;}

  #soundBtn{
    position:fixed;left:18px;bottom:46px;z-index:70;
    width:44px;height:44px;border-radius:50%;
    background:var(--paper);border:1px solid rgba(74,66,56,.15);
    box-shadow:0 4px 14px rgba(74,66,56,.18);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  #soundBtn.show{opacity:1;pointer-events:auto;}
  #soundBtn svg{width:22px;height:22px;color:var(--ink);}

  #volumeSlider{
    position:fixed;left:38px;bottom:100px;z-index:70;
    width:4px;height:100px;
    writing-mode:vertical-lr;direction:rtl;
    -webkit-appearance:slider-vertical;appearance:none;
    background:rgba(74,66,56,.25);border-radius:4px;outline:none;
    opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  #volumeSlider.expanded{opacity:1;pointer-events:auto;}
  #volumeSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--coral);cursor:pointer;}
  #volumeSlider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--coral);border:none;cursor:pointer;}

  /* ---------- 跑馬燈 ---------- */
  #marquee{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:min(92vw,420px);height:30px;z-index:65;
    overflow:hidden;display:flex;align-items:center;
    opacity:0;pointer-events:none;transition:opacity .5s ease;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
  }
  #marquee.show{opacity:1;}
  #marquee .track{display:flex;white-space:nowrap;animation:marqueeScroll 22s linear infinite;}
  #marquee .track span{padding-right:48px;font-family:'Caveat','Noto Sans TC',sans-serif;font-size:1rem;color:var(--ink-soft);}
  @keyframes marqueeScroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6"/>
  </filter>
</svg>

<!-- ============ LOCK / MAIL SCREEN ============ -->
<div id="lock">
  <div class="lock-sub" id="lockSub">距離可以開啟倒數</div>

  <div class="countdown" id="countdown"></div>

  <div class="lock-note" id="lockNote">此封信件只能在 8/12 的晚上 10:26 之後才能打開</div>

  <div id="arrival">
    <div class="arrived-text">時間到了！</div>
  </div>

  <button class="unlock-btn" id="unlockBtn">拆 開 這 封 信</button>
</div>

<!-- ============ 開信前問答關卡 ============ -->
<div id="quiz">
  <div class="quiz-progress" id="quizProgress"></div>
  <div class="quiz-q" id="quizQ"></div>
  <input type="text" class="quiz-input" id="quizInput" autocomplete="off" placeholder="輸入答案">
  <button class="quiz-btn" id="quizSubmit">送出</button>
  <div class="quiz-wrong" id="quizWrong"></div>
</div>

<!-- ============ BOOK ============ -->
<div id="book-wrap">
  <div class="hint" id="hint">左右滑動 / 點兩側翻頁</div>
  <div id="stage"></div>
  <div id="dots"></div>
</div>

<div id="marquee"><div class="track" id="marqueeTrack"></div></div>

<button id="soundBtn" aria-label="切換音樂">
  <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="3 9 9 9 13 5 13 19 9 15 3 15 3 9"></polygon>
    <path id="wave1" d="M16.5 8.5a5 5 0 0 1 0 7"></path>
    <path id="wave2" d="M19 6a9 9 0 0 1 0 12"></path>
  </svg>
</button>
<input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.6" aria-label="音量">

<!--
  背景音樂設定：
  1. 把你的音樂檔重新命名成 BGM.mp3
  2. 放在跟這個 html 檔「同一個資料夾」裡
  3. 傳給對方時，兩個檔案要一起傳（例如打包成 zip，或用支援多檔案的方式傳送）
  如果沒有放 BGM.mp3，音樂按鈕會自動隱藏，其他功能不受影響。

  問答關卡 / 錯誤訊息 / 跑馬燈文字設定：
  跟這個 html 檔同一個資料夾裡的 quiz.txt、wrong-answers.txt、marquee-text.txt
  可以直接編輯內容，格式說明請看檔案裡的範例。
  這三個檔案如果讀不到或是空的，問答關卡會直接略過、跑馬燈也不會顯示，其他功能不受影響。

  提前拆信開關：
  同資料夾裡的 preview-switch.txt 寫 ON 才能連點音量鍵 5 下提前拆信，
  寫 OFF 就會停用這個功能，正式寄出前記得改成 OFF。
-->
<audio id="bgm" src="BGM.mp3" loop preload="auto"></audio>

<script>
/* ---------------- 日期鎖定 ---------------- */
const target = new Date('2026-08-12T22:26:00+08:00').getTime();
let arrived = false;
let openedDate = null;

function pad(n){return n.toString().padStart(2,'0');}
function formatOpenedDate(d){ return d.getFullYear()+' . '+pad(d.getMonth()+1)+' . '+pad(d.getDate()); }

function renderCountdown(){
  if(arrived) return;
  const diff = target - Date.now();
  if(diff <= 0){ triggerArrival(); return; }
  const d = Math.floor(diff/86400000);
  const h = Math.floor(diff%86400000/3600000);
  const m = Math.floor(diff%3600000/60000);
  const s = Math.floor(diff%60000/1000);
  document.getElementById('countdown').innerHTML =
    '<div><span class="num">'+d+'</span><span class="lbl">天</span></div>'+
    '<div><span class="num">'+pad(h)+'</span><span class="lbl">時</span></div>'+
    '<div><span class="num">'+pad(m)+'</span><span class="lbl">分</span></div>'+
    '<div><span class="num">'+pad(s)+'</span><span class="lbl">秒</span></div>';
}
renderCountdown();
setInterval(renderCountdown,1000);

function triggerArrival(){
  arrived = true;
  document.getElementById('countdown').style.display='none';
  document.getElementById('lockSub').style.display='none';
  document.getElementById('lockNote').style.display='none';
  document.getElementById('arrival').style.display='flex';
  setTimeout(()=>{ document.getElementById('unlockBtn').style.display='inline-block'; }, 500);
}

/* ---------------- 預覽模式（自己檢查內容用） ----------------
   方法一：網址後面加上 ?preview=1
   方法二：連續點音量鍵 5 下
------------------------------------------------------------ */
function enterPreview(){
  if(arrived) return;
  arrived = true;
  document.getElementById('countdown').style.display='none';
  document.getElementById('lockSub').style.display='none';
  document.getElementById('lockNote').style.display='none';
  document.getElementById('unlockBtn').textContent = '提 前 拆 開';
  document.getElementById('unlockBtn').style.display='inline-block';
}
const urlParams = new URLSearchParams(location.search);
if(urlParams.get('preview')==='1'){ enterPreview(); }

document.getElementById('unlockBtn').addEventListener('click', ()=>{
  openedDate = new Date();
  document.getElementById('lock').classList.add('hide');
  setTimeout(()=>{
    document.getElementById('lock').style.display='none';
    startQuiz();
  },600);
});

function enterBook(){
  document.getElementById('book-wrap').classList.add('show');
  document.getElementById('marquee').classList.add('show');
  activatePage(0);
  setTimeout(()=>{document.getElementById('hint').style.opacity='0';},2600);
  playBgm();
}

/* ---------------- 開信前問答關卡 ---------------- */
let quizData = [];
let wrongMessages = ['再想看看'];
let quizIndex = 0;

function parseQuiz(text){
  const lines = text.split(/\r?\n/).filter(l=> !l.trim().startsWith('#'));
  const quiz = [];
  lines.forEach(line=>{
    const qm = line.match(/^Q(\d+)\s*[:：]\s*(.*)$/);
    const am = line.match(/^A(\d+)\s*[:：]\s*(.*)$/);
    if(qm){
      const idx = parseInt(qm[1],10)-1;
      quiz[idx] = quiz[idx] || {q:'', a:[]};
      quiz[idx].q = qm[2].trim();
    } else if(am){
      const idx = parseInt(am[1],10)-1;
      quiz[idx] = quiz[idx] || {q:'', a:[]};
      quiz[idx].a = am[2].split(/[|｜]/).map(s=>s.trim()).filter(Boolean);
    }
  });
  return quiz.filter(item=> item && item.q && item.a.length);
}

function parseWrongMessages(text){
  const msgs = text.split(/\r?\n/)
    .map(l=> l.trim())
    .filter(l=> l && !l.startsWith('#'))
    .map(l=> l.replace(/^\d+[.、]\s*/,''));
  return msgs.length? msgs : ['再想看看'];
}

function normalizeAnswer(s){
  return s.trim().toLowerCase().replace(/\s+/g,'');
}

const quizReady = Promise.all([
  fetch('./quiz.txt').then(r=> r.ok? r.text() : '').catch(()=> ''),
  fetch('./wrong-answers.txt').then(r=> r.ok? r.text() : '').catch(()=> '')
]).then(([quizText, wrongText])=>{
  quizData = parseQuiz(quizText);
  if(wrongText) wrongMessages = parseWrongMessages(wrongText);
});

function renderQuizQuestion(){
  document.getElementById('quizProgress').textContent = '第 '+(quizIndex+1)+' / '+quizData.length+' 題';
  document.getElementById('quizInput').value = '';
  document.getElementById('quizWrong').classList.remove('show');

  const qEl = document.getElementById('quizQ');
  qEl.textContent = quizData[quizIndex].q;
  qEl.classList.remove('quiz-q-in');
  void qEl.offsetWidth;
  qEl.classList.add('quiz-q-in');
}

function startQuiz(){
  quizReady.then(()=>{
    if(!quizData.length){ enterBook(); return; }
    quizIndex = 0;
    document.getElementById('quiz').classList.add('show');
    renderQuizQuestion();
    setTimeout(()=> document.getElementById('quizInput').focus(), 300);
  });
}

function submitQuizAnswer(){
  const val = normalizeAnswer(document.getElementById('quizInput').value);
  if(!val) return;
  const accepted = quizData[quizIndex].a.map(normalizeAnswer);
  if(accepted.includes(val)){
    quizIndex++;
    if(quizIndex >= quizData.length){
      document.getElementById('quiz').classList.remove('show');
      enterBook();
    } else {
      renderQuizQuestion();
    }
  } else {
    const msg = wrongMessages[Math.floor(Math.random()*wrongMessages.length)];
    const wrongEl = document.getElementById('quizWrong');
    wrongEl.textContent = msg;
    wrongEl.classList.add('show');
    const quizBox = document.getElementById('quiz');
    quizBox.classList.remove('quiz-shake');
    void quizBox.offsetWidth;
    quizBox.classList.add('quiz-shake');
  }
}

document.getElementById('quizSubmit').addEventListener('click', submitQuizAnswer);
document.getElementById('quizInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') submitQuizAnswer();
});

/* ---------------- 提前拆信開關 ---------------- */
let previewSwitchOn = false;
const previewSwitchReady = fetch('./preview-switch.txt').then(r=> r.ok? r.text() : '').catch(()=> '').then(text=>{
  const line = text.split(/\r?\n/).map(l=> l.trim()).find(l=> l && !l.startsWith('#'));
  previewSwitchOn = (line || '').toUpperCase() === 'ON';
});

/* ---------------- 跑馬燈 ---------------- */
fetch('./marquee-text.txt').then(r=> r.ok? r.text() : '').catch(()=> '').then(text=>{
  const lines = text.split(/\r?\n/).map(l=> l.trim()).filter(l=> l && !l.startsWith('#'));
  const content = lines.length? lines.join('　★　') : '生日快樂　儒儒';
  document.getElementById('marqueeTrack').innerHTML = '<span>'+content+'</span><span>'+content+'</span>';
});

/* ---------------- 背景音樂 ---------------- */
const bgm = document.getElementById('bgm');
const soundBtn = document.getElementById('soundBtn');
const volumeSlider = document.getElementById('volumeSlider');
let bgmReady = false;

bgm.volume = parseFloat(volumeSlider.value);

bgm.addEventListener('canplaythrough', ()=>{
  bgmReady = true;
  soundBtn.classList.add('show');
}, {once:true});
bgm.addEventListener('error', ()=>{ soundBtn.classList.remove('show'); volumeSlider.classList.remove('expanded'); });

volumeSlider.addEventListener('input', (e)=>{
  e.stopPropagation();
  bgm.volume = parseFloat(volumeSlider.value);
});
volumeSlider.addEventListener('click', e=> e.stopPropagation());

function playBgm(){
  bgm.play().then(()=>{
    soundBtn.classList.add('show');
    setSoundIcon(true);
  }).catch(()=>{ /* 檔案不存在或瀏覽器擋自動播放，忽略即可 */ });
}

/* 網頁一打開就直接當背景音樂播放，不用等拆信或時間到。
   瀏覽器大多禁止網頁一載入就自動有聲音播放，所以這裡先直接嘗試播放，
   如果被瀏覽器擋下來，就退而求其次改成第一次點擊/觸碰畫面時馬上播放。 */
playBgm();
document.addEventListener('click', playBgm, {once:true});
document.addEventListener('touchstart', playBgm, {once:true});

function setSoundIcon(playing){
  document.getElementById('wave1').style.display = playing? '' : 'none';
  document.getElementById('wave2').style.display = playing? '' : 'none';
}

let tapCount=0, tapTimer=null;
soundBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(bgm.paused){ bgm.play(); setSoundIcon(true); }
  else { bgm.pause(); setSoundIcon(false); }
  volumeSlider.classList.toggle('expanded');

  tapCount++;
  clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{tapCount=0;},1500);
  if(tapCount>=5){
    tapCount=0;
    previewSwitchReady.then(()=>{ if(previewSwitchOn) enterPreview(); });
  }
});

document.addEventListener('click', (e)=>{
  if(e.target!==soundBtn && e.target!==volumeSlider && !soundBtn.contains(e.target)){
    volumeSlider.classList.remove('expanded');
  }
});

/* ---------------- 手寫動畫工具 ---------------- */
function handwriteHTML(text){
  if(!text) return '';
  let i=0;
  return text.split('\n').map(line=>{
    return [...line].map(ch=>{
      if(ch===' '){ i++; return ' '; }
      const delay = (i*0.045).toFixed(3);
      i++;
      return '<span class="hw-ch" style="animation-delay:'+delay+'s">'+ch+'</span>';
    }).join('');
  }).join('<br>');
}

/* ---------------- 建立書本 ---------------- */
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
let current = 0;
const total = pages.length;
const maxPageNum = Math.max(...pages.filter(p=>p.num).map(p=>p.num));
const playedPages = new Set();

pages.forEach((p, i)=>{
  const pageEl = document.createElement('div');
  pageEl.className='page';
  pageEl.style.zIndex = total - i;

  const bodyHtml = p.blank
    ? ``
    : p.photoOnly
    ? `<img class="page-photo" src="${p.img}" alt="">
       ${p.cls==='final'? `<div class="stamp" id="stampMark"><div class="stamp-line1">已拆封</div><div class="stamp-line2" id="stampDate"></div></div>
       <button class="replay replay-floating" id="replayBtn">再翻一次 ↺</button>`:''}`
    : p.img
    ? `<img class="page-photo" src="${p.img}" alt="">
       <div class="photo-caption">
         ${p.title? `<div class="ptitle">${handwriteHTML(p.title)}</div>`:''}
         <div class="ptext">${handwriteHTML(p.text)}</div>
         ${p.cls==='final'? `<button class="replay" id="replayBtn">再翻一次 ↺</button>`:''}
       </div>`
    : p.big
    ? `<div class="big-line1">${handwriteHTML(p.big[0])}</div>
       <div class="big-line2">${handwriteHTML(p.big[1])}</div>`
    : `${p.doodle? `<svg class="corner-mark" viewBox="0 0 100 100" style="filter:url(#pencil)">
         <circle cx="50" cy="50" r="30" stroke="var(--ink)" stroke-width="6" fill="none"/>
       </svg>
       <svg class="doodle" viewBox="0 0 100 100" style="filter:url(#pencil)">${p.doodle}</svg>` : ''}
       ${p.title? `<div class="ptitle">${handwriteHTML(p.title)}</div>`:''}
       <div class="ptext">${handwriteHTML(p.text)}</div>`;

  pageEl.innerHTML = `
    <div class="face front ${p.cls||''} ${p.img? 'has-photo':''}">
      ${bodyHtml}
      ${p.num? `<div class="pnum">${p.num} / ${maxPageNum}</div>`:''}
      ${(p.cls==='final' && !p.img)? `<button class="replay" id="replayBtn">再翻一次 ↺</button>`:''}
    </div>
    <div class="face back"></div>
  `;
  stage.appendChild(pageEl);

  const dot = document.createElement('span');
  if(i===0) dot.className='active';
  dotsWrap.appendChild(dot);
});

const pageEls = [...document.querySelectorAll('.page')];
const dotEls = [...document.querySelectorAll('#dots span')];

function updateDots(){ dotEls.forEach((d,i)=> d.classList.toggle('active', i===current)); }

function activatePage(idx){
  if(playedPages.has(idx)) return;
  playedPages.add(idx);
  pageEls[idx].querySelectorAll('.ptitle,.ptext,.big-line1,.big-line2,.page-photo').forEach(t=> t.classList.add('go'));
  if(idx === total-1){
    const stampDate = pageEls[idx].querySelector('#stampDate');
    const stampMark = pageEls[idx].querySelector('#stampMark');
    if(stampDate) stampDate.textContent = formatOpenedDate(openedDate || new Date());
    if(stampMark) setTimeout(()=> stampMark.classList.add('show'), 500);
  }
}

function goNext(){
  if(current < total-1){
    pageEls[current].style.transform='rotateY(-180deg)';
    pageEls[current].style.zIndex = 1;
    current++;
    updateDots();
    activatePage(current);
  }
}
function goPrev(){
  if(current > 0){
    current--;
    pageEls[current].style.transform='rotateY(0deg)';
    pageEls[current].style.zIndex = total - current;
    updateDots();
  }
}

stage.addEventListener('click', (e)=>{
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if(x > rect.width/2){ goNext(); } else { goPrev(); }
});

let touchStartX=null;
stage.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
stage.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(dx < -40) goNext();
  else if(dx > 40) goPrev();
  touchStartX=null;
});

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='replayBtn'){
    e.stopPropagation();
    pageEls.forEach((el,i)=>{ el.style.transform='rotateY(0deg)'; el.style.zIndex = total-i; });
    current = 0;
    updateDots();
  }
});

function launchConfetti(){
  const wrap = document.createElement('div');
  wrap.className='confetti';
  const emojis=['🎉','🎈','💛','✨','🍰'];
  for(let i=0;i<26;i++){
    const s = document.createElement('i');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100+'%';
    s.style.animationDuration = (3+Math.random()*2.5)+'s';
    s.style.animationDelay = (Math.random()*1.2)+'s';
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(()=> wrap.remove(), 7000);
}
